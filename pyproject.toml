[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

##########################
# Specific
##########################
[project]
name = "datacraft"
version = "0.8.0"
description = "Data Science"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT License" }
authors = [{ name = "Gokhan Ileri" }]
urls = { Homepage = "https://github.com/agokhanileri/datacraft" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: BSD License",
  "Operating System :: MacOS :: MacOS X"
]
dependencies = [
  "scikit-learn"  	# machine learning library
  "statsmodels" 	  # statistical modeling library
  "numpy"         	# array computing library
  "pandas"       		# data analysis library
  "scipy"        		# scientific computing library
  "sympy"        		# symbolic mathematics library
  "matplotlib"   		# 2D/3D plotting library
  "seaborn"      		# statistical data visualization library
  "plotly"       		# interactive graphing library
  "xlsxwriter"		  # advanced Excel I/O
  "sqlalchemy"  		# SQL toolkit and ORM
  "psycopg"        	# PostgreSQL driver for SQLAlchemy
  "pydantic"      	# data validation and settings management for APIs  "python-multipart" # needed for form parsing in FastAPI  "pyarrow"      		# fast columnar data interchange and Parquet I/O
  "duckdb" 			    # fast local analytics over Parquet/CSV, integrates with Arrow
  "statsmodels  		# statistical modeling library
  "sqlalchemy"      # database library
#  "jupyter"      	# interactive notebooks
#  "jupyterlab"  		# next-generation user interface for Jupyter notebooks
#  "notebook"   		# web-based interactive computing environment
]

[project.optional-dependencies]
dev = ["black", "ruff", "mypy", "pytest", "pre-commit", "rich", "ipython"]

# Explicit package discovery (adjust if you use src/ layout)
[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]


##########################
# General
##########################
[tool.black]
line-length = 99
target-version = ["py312"]
skip-string-normalization = false

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle (PEP 8 checks)
  "F",        # pyflakes
  "I",        # import sorting (isort)
  "UP",       # pyupgrade
  "SIM",      # simplify
  "N",        # naming
  "B",        # bugbear
  "C4",       # comprehensions
  "TID",      # tidy imports
]
ignore = [
  "T201"      # print() occurrences
  "D103"      # missing function docstrings --> for compactness
  "D107"      # missing class docstrings --> //
  "B018"      # unused loop vars --> for clarity (need manual check for big loops)
  "N802"      # camelCase not allowed --> allow for LC
  "PLR1702"   # combine if branches sharing the same body --> for clarity
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["serdes"]

[tool.pydocstyle]
ignore = ["D100", "D101", "D102", "D103", "D107"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool:pytest]
addopts = -q
testpaths = tests
