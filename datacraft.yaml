name: datacraft

channels: [conda-forge]
channel_priority: strict  # avoids accidental pulls from the default channel

dependencies:   # solver picks latest stable python available
# Runtime
- python=3.12.* 	# stdlib(os, math, pathlib, asyncio, etc.) + Cython
- pip           	  		# packaging, runtime
- setuptools    		#
- wheel         		#
- ipython       		# improved REPL
#- spyder>6 			# spyder version 6+ --> using VS Code to save space
#- spyder-kernels>3 	# spyder kernels version 3+ //

# Performance
- llvm-openmp  	# multithreading API used by NumPy, SciPy, scikit-learn etc.
#- ninja         			# fast low-level build tool auto-detected by cmake
#- pkg-config    		#
#- cmake    				# for C/C++ or Fortran extensions
#- cython      			# for C/C++ extensions

# Code Quality
- black         			# formatter
- ruff          			# linter
- mypy          		# type-checker (static)
- pytest        			# tester
- pytest-cov		# pytest plugin for test coverage
- pre-commit   		# committer
- rich             			# colored log + pretty print

# Data I/O
- xlsxwriter			# advanced Excel I/O
- sqlalchemy    		# SQL toolkit and ORM
- psycopg        		# PostgreSQL driver for SQLAlchemy
- pydantic      		# data validation and settings management for APIs
- pyarrow       		# fast columnar data interchange and Parquet I/O
- duckdb 			# fast local analytics over Parquet/CSV, integrates with Arrow

# Data Analytics
- pandas  			# data frames
- numpy         		# arrays, linear algebra, binary-heavy
- scipy         			# scientific compute
- sympy         		# symbolic math
- scikit-learn  		# machine learning
- statsmodels  	    	# statistical modeling 

# Data Visualization
- matplotlib    		# plotter
- seaborn          		# pretty stats plots
- plotly   			# interactive graphs
#- kaleido 				# export Plotly figures to PNG/PDF
#- jupyter       			# interactive notebooks
#- jupyterlab   			# next-generation user interface for Jupyter notebooks
#- notebook   			# web-based interactive computing environment
